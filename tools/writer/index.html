<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>写作台 · CTF 手记</title><link id="brand-icon" rel="icon" href="/assets/avatar.svg"><link rel="stylesheet" href="/assets/fontawesome/css/all.min.css"><link rel="stylesheet" href="/style.css"></head>
<body>
  <aside class="sidebar">
    <a class="brand" href="http://127.0.0.1:4000/" target="_blank" rel="noopener"><img id="brand-avatar" src="/assets/avatar.svg" alt=""><span><span id="brand-title">CTF 手记</span><small>你的本地写作空间</small></span></a>
    <button id="new-post" class="primary new-button"><i class="fas fa-plus"></i> 新建文章</button>
    <label class="list-search"><i class="fas fa-search"></i><input id="filter" placeholder="查找文章…" aria-label="查找文章"></label>
    <div class="list-label"><span>页面</span></div>
    <div class="page-list"><button id="edit-about" class="post-button" type="button"><strong>关于这个博客</strong><small><span class="badge">页面</span></small></button></div>
    <div class="list-label"><span>全部内容</span><span id="post-count">0</span></div>
    <div id="post-list" class="post-list" aria-label="文章列表"></div>
    <div class="sidebar-bottom"><button id="settings"><i class="fas fa-sliders"></i> 站点设置</button><a href="http://127.0.0.1:4000/" target="_blank" rel="noopener"><i class="fas fa-arrow-up-right-from-square"></i> 查看博客</a><span class="local-indicator"><b></b> 文件保存在这台电脑</span></div>
  </aside>
  <main>
    <header class="topbar"><div><span class="eyebrow">WRITE · LEARN · REPEAT</span><h1>写下想记录的东西</h1></div><div class="top-actions"><span id="save-state" role="status">正在连接…</span><button id="view-post" class="secondary"><i class="fas fa-arrow-up-right-from-square"></i> 查看文章</button><button id="publish" class="secondary" title="提交并推送到 GitHub，线上会自动构建"><i class="fas fa-paper-plane"></i> 发布到线上</button><button id="save" class="primary"><i class="fas fa-check"></i> 保存文章</button><button id="delete-post" class="secondary danger" title="删除这篇文章"><i class="fas fa-trash-can"></i> 删除</button></div></header>
    <section class="document-meta"><input id="title" class="title-input" maxlength="160" placeholder="给这篇文章起个名字" aria-label="文章标题"><div class="meta-grid"><label>分类<input id="categories" list="category-options" placeholder="例如：随笔, 学习手记"><datalist id="category-options"><option value="CTF"><option value="CTF, Misc"><option value="CTF, Web"><option value="CTF, Crypto"><option value="CTF, Reverse"><option value="CTF, Pwn"><option value="学习手记"><option value="随笔"><option value="笔记"></datalist></label><label>标签<input id="tags" placeholder="用逗号分隔，如 随笔, 日常"></label><label>状态<select id="status"><option value="drafts">草稿 · 仅写作台可见</option><option value="posts">文章 · 本地博客可见</option></select></label></div><label class="description-label">摘要<input id="description" maxlength="500" placeholder="用一句话介绍这篇文章（选填）"></label></section>
    <section class="writing-area">
      <div class="toolbar"><div class="tools"><button type="button" data-snippet="heading" title="插入二级标题">H₂</button><button type="button" data-snippet="bold" title="加粗"><b>B</b></button><button type="button" data-snippet="code" title="插入代码块"><i class="fas fa-code"></i></button><button type="button" data-snippet="quote" title="插入引用"><i class="fas fa-quote-left"></i></button><span class="separator"></span><button id="insert-image" type="button"><i class="far fa-image"></i><span>插入图片</span></button><input id="image-file" type="file" accept="image/png,image/jpeg,image/webp,image/gif" multiple hidden></div><div class="view-tabs" aria-label="编辑视图"><button data-view="split" class="active">分栏</button><button data-view="edit">编辑</button><button data-view="preview">预览</button></div></div>
      <div class="panes" data-view="split"><div class="editor-pane"><div class="pane-label"><span>MARKDOWN</span><span>截图后 Ctrl + V，或拖入图片</span></div><textarea id="content" spellcheck="false" aria-label="Markdown 正文" placeholder="## 写在前面&#10;&#10;从这里开始写…"></textarea><div class="drop-hint">松开鼠标，插入截图</div></div><div class="preview-pane"><div class="pane-label"><span>正文预览</span><span>文章样式以博客为准</span></div><iframe id="preview" title="Markdown 正文预览" sandbox=""></iframe></div></div>
      <footer class="editor-footer"><span id="word-count">0 字符</span><span id="document-path">新文章</span><span>Ctrl + S 保存</span></footer>
    </section>
    <div class="local-note"><i class="fas fa-circle-info"></i> 保存会更新本地文件。上线后，访客才能在公开网址看到文章。</div>
  </main>
  <div id="toast" role="status" aria-live="polite"></div>
  <dialog id="settings-dialog"><form id="settings-form"><div class="dialog-header"><div><span class="eyebrow">MAKE IT YOURS</span><h2>站点设置</h2></div><button type="button" id="close-settings" aria-label="关闭设置">×</button></div><div class="avatar-settings"><img id="avatar-preview" src="/assets/avatar.svg" alt="当前头像"><div class="avatar-copy"><span>头像</span><button type="button" id="avatar-button" class="secondary"><i class="fas fa-upload"></i> 上传新头像</button><small>PNG / JPG / WebP / GIF，5 MB 以内；上传后自动生效。</small></div><input id="avatar-file" type="file" accept="image/png,image/jpeg,image/webp,image/gif" hidden></div><label>博客名称<input id="site-title" required maxlength="100"></label><label>作者 / 昵称<input id="site-author" required maxlength="100"></label><label>博客简介（同时显示在首页右侧作者卡）<textarea id="site-description" rows="3" maxlength="500"></textarea></label><p>保存后本地预览会重启，刷新 <a href="http://127.0.0.1:4000/" target="_blank" rel="noopener">本地博客</a> 即可看到效果；上线需要再点“发布博客”。</p><button class="primary" type="submit">保存设置</button></form></dialog>
  <script src="/app.js" defer></script>
</body></html>
